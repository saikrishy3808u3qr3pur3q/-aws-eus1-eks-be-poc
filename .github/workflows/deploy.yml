name: Deploy Backend to ECR

permissions: write-all

on:
  push:
    branches:
      - dev
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPO: eks-non-prod-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure environment based on branch
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "dev" ]]; then
            echo "ENV_TAG=dev" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == "uat" ]]; then
            echo "ENV_TAG=uat" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          REPOSITORY: ${{ env.ECR_REPO }}
        run: |
          commit_id=$(echo $GITHUB_SHA | cut -c1-7)
          build_id=${GITHUB_RUN_NUMBER}
          IMAGE_TAG="${commit_id}-${build_id}-${{ env.ENV_TAG }}"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          echo "Pushing image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          # Also tag and push the env-specific latest (dev-latest or uat-latest)
          docker tag "$IMAGE_URI" "${REGISTRY}/${REPOSITORY}:${{ env.ENV_TAG }}-latest"
          docker push "${REGISTRY}/${REPOSITORY}:${{ env.ENV_TAG }}-latest"
